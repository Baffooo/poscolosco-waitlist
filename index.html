<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Posco Losco Waiting List</title>
  
  <!-- Favicon & Icona Schermata Home iPhone (PWA) -->
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
  
  <!-- Web App PWA Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Posco Losco">
  <meta name="theme-color" content="#0a0a0a">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#0a0a0a',
              card: '#121212',
              border: '#262626',
              accent: '#ffffff',
              muted: '#737373'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 2px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-brand-black/90 backdrop-blur-md border-b border-brand-border px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <!-- Container Logo Quadrato e Centrato -->
      <div class="w-10 h-10 rounded-lg bg-black border border-brand-border p-1 flex items-center justify-center shrink-0 overflow-hidden">
        <img src="logo.jpg" alt="Posco Losco Logo" class="max-w-full max-h-full object-contain">
      </div>
      <div>
        <!-- Titolo su due righe -->
        <h1 class="text-sm font-extrabold tracking-wider text-white uppercase leading-none">POSCO LOSCO</h1>
        <h2 class="text-xs font-bold tracking-widest text-neutral-300 uppercase leading-tight mt-0.5">WAITING LIST</h2>
        <p class="text-[10px] text-brand-muted font-medium leading-tight mt-0.5">Tattoo Client Priority System</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="voice-btn" onclick="startVoiceRecognition()" class="p-2.5 rounded-full bg-brand-card border border-brand-border text-white hover:border-white transition-all active:scale-95 relative" title="Comando Vocale">
        <i data-lucide="mic" class="w-5 h-5"></i>
        <span id="voice-pulse" class="hidden absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
      </button>
      <button onclick="openModal()" class="px-3.5 py-2 rounded-full bg-white text-black font-semibold text-sm hover:bg-neutral-200 transition-all active:scale-95 flex items-center gap-1.5">
        <i data-lucide="plus" class="w-4 h-4"></i> Nuovo
      </button>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-4">

    <!-- STATO SINCRO / LOCALE -->
    <div class="flex justify-between items-center text-xs px-1 text-brand-muted">
      <span id="status-indicator">Inizializzazione...</span>
      <span>Priorità: ASAP > Relax</span>
    </div>

    <!-- FILTRI E RICERCA -->
    <div class="flex gap-2">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-brand-muted"></i>
        <input type="text" id="search-input" oninput="renderList()" placeholder="Cerca cliente o note..." class="w-full bg-brand-card border border-brand-border rounded-xl pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-white">
      </div>
      <select id="filter-location" onchange="renderList()" class="bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        <option value="ALL">Tutti i Luoghi</option>
        <option value="The Grind">The Grind</option>
        <option value="Milano City Ink">Milano City Ink</option>
        <option value="Remember">Remember</option>
        <option value="Conventions">Conventions</option>
      </select>
    </div>

    <!-- LISTA CLIENTI -->
    <div id="client-list" class="space-y-3">
      <!-- Le schede verranno inserite qui dinamicamente -->
    </div>

    <!-- STATO VUOTO -->
    <div id="empty-state" class="hidden py-16 text-center space-y-3">
      <i data-lucide="inbox" class="w-12 h-12 mx-auto text-brand-muted stroke-1"></i>
      <p class="text-brand-muted text-sm">Nessun cliente presente in lista d'attesa.</p>
    </div>

  </main>

  <!-- MODALE FORM (NUOVO / MODIFICA) -->
  <div id="modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-brand-card border border-brand-border w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-5 max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex justify-between items-center border-b border-brand-border pb-3">
        <h2 id="modal-title" class="text-lg font-bold text-white uppercase tracking-wider">Nuovo Cliente</h2>
        <button onclick="closeModal()" class="text-brand-muted hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="client-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="field-id">

        <!-- Nome Cliente -->
        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Nome Cliente *</label>
          <input type="text" id="field-name" required placeholder="Es. Mario Rossi" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        </div>

        <!-- Contatto (Telefono) -->
        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Contatto (Telefono) *</label>
          <input type="tel" id="field-contact" required placeholder="Es. +39 333 1234567" class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        </div>

        <!-- Tipo Progetto & Priorità -->
        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Tipo Progetto & Priorità *</label>
          <select id="field-priority" required class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
            <option value="1">Continuo Progetto – Prima possibile (Rank 1)</option>
            <option value="2">Nuovo Tatuaggio – Prima possibile (Rank 2)</option>
            <option value="3">Continuo Progetto – Senza fretta (Rank 3)</option>
            <option value="4">Nuovo Tatuaggio – Senza fretta (Rank 4)</option>
          </select>
        </div>

        <!-- Luogo -->
        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Luogo *</label>
          <select id="field-location" required class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
            <option value="The Grind">The Grind</option>
            <option value="Milano City Ink">Milano City Ink</option>
            <option value="Remember">Remember</option>
            <option value="Conventions">Conventions</option>
          </select>
        </div>

        <!-- Data Inserimento -->
        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Data Inserimento *</label>
          <input type="date" id="field-date" required class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
        </div>

        <!-- Note -->
        <div>
          <label class="block text-xs font-medium text-brand-muted mb-1">Note</label>
          <textarea id="field-notes" rows="3" placeholder="Dettagli progetto, zona corpo, orari..." class="w-full bg-brand-black border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-white"></textarea>
        </div>

        <!-- Pulsanti Azione -->
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-brand-border text-brand-muted hover:text-white font-medium text-sm transition-all">Annulla</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-white text-black font-semibold text-sm hover:bg-neutral-200 transition-all">Salva Cliente</button>
        </div>
      </form>

    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- LOGICA APPLICAZIONE -->
  <script>
    // =========================================================================
    // 1. CONFIGURAZIONE FIREBASE (Sostituisci i dati con la tua console Firebase)
    // =========================================================================
const firebaseConfig = {
  apiKey: "AIzaSyA4wGo1mHsVQzHuOMn5j8caAhVh5f35Ugo",
  authDomain: "poscolosco-waitlist.firebaseapp.com",
  projectId: "poscolosco-waitlist",
  storageBucket: "poscolosco-waitlist.firebasestorage.app",
  messagingSenderId: "980745632830",
  appId: "1:980745632830:web:7370506d3dca261a15a56f",
  measurementId: "G-9T2D1DWEV9"
};

    let db = null;
    let useLocalStorage = false;
    let clientsData = [];

    // Inizializzazione Firebase o fallback su LocalStorage
    try {
      if (firebaseConfig.apiKey !== "INSERISCI_LA_TUA_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        document.getElementById('status-indicator').innerText = "Cloud Sync (Firebase)";
        initFirebaseListener();
      } else {
        throw new Error("Firebase non configurato, proseguo in locale.");
      }
    } catch (e) {
      useLocalStorage = true;
      document.getElementById('status-indicator').innerText = "Modalità Locale (LocalStorage)";
      loadFromLocalStorage();
    }

    // =========================================================================
    // 2. GESTIONE DATI (FIREBASE & LOCALSTORAGE)
    // =========================================================================
    function initFirebaseListener() {
      db.collection("waiting_list_posco").onSnapshot(snapshot => {
        clientsData = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        renderList();
      }, error => {
        console.error("Errore Firebase:", error);
        document.getElementById('status-indicator').innerText = "Errore Connessione Cloud";
      });
    }

    function loadFromLocalStorage() {
      const data = localStorage.getItem('poscolosco_waiting_list');
      clientsData = data ? JSON.parse(data) : [];
      renderList();
    }

    function saveLocal() {
      if (useLocalStorage) {
        localStorage.setItem('poscolosco_waiting_list', JSON.stringify(clientsData));
        renderList();
      }
    }

    async function saveClient(client) {
      if (!useLocalStorage && db) {
        if (client.id) {
          const id = client.id;
          delete client.id;
          await db.collection("waiting_list_posco").doc(id).set(client);
        } else {
          delete client.id;
          await db.collection("waiting_list_posco").add(client);
        }
      } else {
        if (client.id) {
          const index = clientsData.findIndex(c => c.id === client.id);
          if (index !== -1) clientsData[index] = client;
        } else {
          client.id = 'local_' + Date.now();
          clientsData.push(client);
        }
        saveLocal();
      }
    }

    async function deleteClient(id) {
      if (confirm("Sei sicuro di voler rimuovere questo cliente dalla lista d'attesa?")) {
        if (!useLocalStorage && db) {
          await db.collection("waiting_list_posco").doc(id).delete();
        } else {
          clientsData = clientsData.filter(c => c.id !== id);
          saveLocal();
        }
      }
    }

    // =========================================================================
    // 3. ORDINAMENTO & RENDERING LISTA
    // =========================================================================
    const PRIORITY_LABELS = {
      1: { text: 'Continuo – ASAP', badge: 'bg-white text-black font-bold' },
      2: { text: 'Nuovo – ASAP', badge: 'bg-neutral-300 text-black font-medium' },
      3: { text: 'Continuo – Relax', badge: 'bg-neutral-800 text-neutral-300 border border-neutral-700' },
      4: { text: 'Nuovo –
